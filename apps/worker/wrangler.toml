name = "chasa-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
# Keep workers.dev up until api.chasa.io is attached (a --domains deploy with no zone
# can otherwise disable the workers.dev route and take the API offline).
workers_dev = true
preview_urls = true

[triggers]
crons = ["0 3 * * *", "0 14 * * *"]

# Custom API host (Cloudflare zone must be Active for this to resolve publicly).
[[routes]]
pattern = "api.chasa.io"
custom_domain = true

# Create with: wrangler d1 create chasa-db, then paste the returned database_id below, then run:
# wrangler d1 migrations apply chasa-db --local (dev) / --remote (prod)
[[d1_databases]]
binding = "CHASA_DB"
database_name = "chasa-db"
database_id = "1f5d8f25-0406-476e-abda-ac8f62c861aa"

# Free (10k neurons/day, resets daily) — no account or API key needed.
[ai]
binding = "AI"

# --- Non-secret config ---
# This is the deployed (production) value. Local `wrangler dev` overrides it via
# apps/worker/.dev.vars, which takes precedence over [vars] when running locally.
[vars]
# Until chasa.io is attached on Pages, keep the preview origin so OAuth / magic-link
# redirects land somewhere that resolves. Flip to https://chasa.io after Custom domains are Active.
PUBLIC_APP_URL = "https://chasa-71s.pages.dev"
PUBLIC_WORKER_URL = "https://api.chasa.io"
WORKERS_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"
FEEDBACK_EMAIL = "founder@chasa.io"
ADMIN_EMAIL = "rl@relacon.at"
STRIPE_PRICE_SOLO = "price_1TxMxKQu2Ibd9xnHtDozkRT5"
STRIPE_PRICE_PRO = "price_1TxMyFQu2Ibd9xnHPDe4L9q4"
STRIPE_PRICE_ENTERPRISE = "price_1TxMzNQu2Ibd9xnHUnRjRDQv"
# Cloudflare Turnstile site key (public). Create a widget in the CF dashboard, then paste here.
TURNSTILE_SITE_KEY = "0x4AAAAAAD-e9VZ4OPi8EPWM"

# --- Google (Sign-In + integrations connector) ---
# Client IDs are non-secret. Secrets via wrangler secret put (see comments below).
GOOGLE_LOGIN_CLIENT_ID = "111635541806-70v6voa6a9kafmmgbhuokh2a07rvdlir.apps.googleusercontent.com"
GOOGLE_INTEGRATIONS_CLIENT_ID = "111635541806-ie2hbeub99831tl1q610mt6kmjl7r00v.apps.googleusercontent.com"
# Local/dev without a real widget: use Cloudflare's always-pass test site key:
#   TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
#   and in .dev.vars: TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA
# Or leave both unset — verification is bypassed with a console warning.

# --- Secrets (never stored in this file) ---
# Set with: wrangler secret put TOKEN_SECRET            (generate: openssl rand -hex 32)
# Set with: wrangler secret put RESEND_API_KEY
# Set with: wrangler secret put ADMIN_PASSWORD           (admin dashboard at /app/admin + password sign-in on /app/login for ADMIN_EMAIL)
# Set with: wrangler secret put TURNSTILE_SECRET_KEY     (Turnstile widget secret from CF dashboard)
# Set with: wrangler secret put STRIPE_SECRET_KEY
# Set with: wrangler secret put STRIPE_WEBHOOK_SECRET
# Cloud storage OAuth (optional — Connect buttons return 503 until set):
#   Redirect URIs (register in each provider console):
#     https://api.chasa.io/api/account/connectors/dropbox/callback
#     https://api.chasa.io/api/account/connectors/onedrive/callback
#     https://api.chasa.io/api/account/connectors/box/callback
#     https://api.chasa.io/api/account/connectors/google/callback
#   Login redirect: https://api.chasa.io/api/auth/google/callback
# Set with: wrangler secret put GOOGLE_LOGIN_CLIENT_SECRET
# Set with: wrangler secret put GOOGLE_INTEGRATIONS_CLIENT_SECRET
# Set with: wrangler secret put DROPBOX_CLIENT_ID
# Set with: wrangler secret put DROPBOX_CLIENT_SECRET
# Set with: wrangler secret put ONEDRIVE_CLIENT_ID
# Set with: wrangler secret put ONEDRIVE_CLIENT_SECRET
# Set with: wrangler secret put BOX_CLIENT_ID
# Set with: wrangler secret put BOX_CLIENT_SECRET
# Native accounting OAuth (optional):
#   https://api.chasa.io/api/account/connectors/quickbooks/callback
#   https://api.chasa.io/api/account/connectors/xero/callback
# Set with: wrangler secret put QBO_CLIENT_ID
# Set with: wrangler secret put QBO_CLIENT_SECRET
# Set with: wrangler secret put XERO_CLIENT_ID
# Set with: wrangler secret put XERO_CLIENT_SECRET
# Price IDs are non-secret — set above as STRIPE_PRICE_SOLO / PRO / ENTERPRISE.

# --- Staging: isolated D1 so testing never touches production data ---
# Deploy with: wrangler deploy --env staging
# Secrets: wrangler secret put TOKEN_SECRET --env staging (RESEND_API_KEY intentionally left
# unset here — emails just log to the console instead of actually sending during testing)
[env.staging]
name = "chasa-worker-staging"

[[env.staging.d1_databases]]
binding = "CHASA_DB"
database_name = "chasa-db-staging"
database_id = "REPLACE_WITH_STAGING_D1_DATABASE_ID"

[env.staging.ai]
binding = "AI"

[env.staging.vars]
PUBLIC_APP_URL = "http://localhost:5173"
PUBLIC_WORKER_URL = "https://chasa-worker-staging.workers.dev"
WORKERS_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"
FEEDBACK_EMAIL = "founder@chasa.io"
STRIPE_PRICE_SOLO = "price_1TxMxKQu2Ibd9xnHtDozkRT5"
STRIPE_PRICE_PRO = "price_1TxMyFQu2Ibd9xnHPDe4L9q4"
STRIPE_PRICE_ENTERPRISE = "price_1TxMzNQu2Ibd9xnHUnRjRDQv"
